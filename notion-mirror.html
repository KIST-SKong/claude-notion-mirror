<title>Notion 미러</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Notion-style workspace — warm-gray sidebar on the left, a centered 708px page column on the right; sidebar becomes a bottom sheet on phones */
:root{
  --bg:#FFFFFF; --side:#F7F7F5; --side-ink:#5F5E5B; --ink:#37352F; --muted:#787774; --faint:#A5A29A;
  --line:#E9E9E7; --hover:rgba(55,53,47,.06); --hover-2:rgba(55,53,47,.1);
  --accent:#2383E2; --accent-ink:#FFFFFF; --accent-soft:#E7F3F8; --danger:#E03E3E; --ok:#448361;
  --menu:#FFFFFF; --shadow:rgba(15,15,15,.12);
  --hl-gray:#F1F1EF; --hl-brown:#F4EEEE; --hl-orange:#FBECDD; --hl-yellow:#FBF3DB; --hl-green:#EDF3EC;
  --hl-blue:#E7F3F8; --hl-purple:#F6F3F9; --hl-pink:#FAF1F5; --hl-red:#FDEBEC;
  --tx-gray:#787774; --tx-brown:#9F6B53; --tx-orange:#D9730D; --tx-yellow:#CB912F; --tx-green:#448361;
  --tx-blue:#337EA9; --tx-purple:#9065B0; --tx-pink:#C14C8A; --tx-red:#D44C47;
  --f-body:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Helvetica,Arial,sans-serif;
  --f-mono:"SFMono-Regular",Menlo,Consolas,"D2Coding",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191919; --side:#202020; --side-ink:#9B9B9B; --ink:#E3E2E0; --muted:#9B9B9B; --faint:#5F5F5F;
  --line:#2F2F2F; --hover:rgba(255,255,255,.055); --hover-2:rgba(255,255,255,.09);
  --accent:#529CCA; --accent-ink:#0B1A24; --accent-soft:#1F2D36; --danger:#FF7369; --ok:#6CBF8C;
  --menu:#252525; --shadow:rgba(0,0,0,.5);
  --hl-gray:#2F2F2F; --hl-brown:#4A3228; --hl-orange:#5C3B23; --hl-yellow:#564328; --hl-green:#243D30;
  --hl-blue:#143A4E; --hl-purple:#3C2D49; --hl-pink:#4E2C3C; --hl-red:#522E2A;
  --tx-gray:#9B9B9B; --tx-brown:#BA856F; --tx-orange:#C77D48; --tx-yellow:#CA9849; --tx-green:#529E72;
  --tx-blue:#5E87C9; --tx-purple:#9D68D3; --tx-pink:#D15796; --tx-red:#DF5452; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191919; --side:#202020; --side-ink:#9B9B9B; --ink:#E3E2E0; --muted:#9B9B9B; --faint:#5F5F5F;
  --line:#2F2F2F; --hover:rgba(255,255,255,.055); --hover-2:rgba(255,255,255,.09);
  --accent:#529CCA; --accent-ink:#0B1A24; --accent-soft:#1F2D36; --danger:#FF7369; --ok:#6CBF8C;
  --menu:#252525; --shadow:rgba(0,0,0,.5);
  --hl-gray:#2F2F2F; --hl-brown:#4A3228; --hl-orange:#5C3B23; --hl-yellow:#564328; --hl-green:#243D30;
  --hl-blue:#143A4E; --hl-purple:#3C2D49; --hl-pink:#4E2C3C; --hl-red:#522E2A;
  --tx-gray:#9B9B9B; --tx-brown:#BA856F; --tx-orange:#C77D48; --tx-yellow:#CA9849; --tx-green:#529E72;
  --tx-blue:#5E87C9; --tx-purple:#9D68D3; --tx-pink:#D15796; --tx-red:#DF5452; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{background:var(--danger);color:#FFFFFF;border-color:var(--danger)}
.btn.ghost.danger{background:transparent;color:var(--muted);border-color:transparent}
.btn.ghost.danger:hover{color:var(--danger)}
.confirm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--menu);box-shadow:0 0 0 1px var(--line),0 8px 24px var(--shadow);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px);font-size:14px}
.confirm .cm{flex:1 1 220px;min-width:0}
.del-btn{padding:0 5px}
.grid tr:hover .del-btn:hover{color:var(--danger);border-color:var(--danger)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:default}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.col{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}

/* sidebar */
.side{background:var(--side);color:var(--side-ink);overflow-y:auto;padding:10px 8px 24px;display:flex;flex-direction:column;gap:14px;min-height:0}
.ws{display:flex;align-items:center;gap:8px;padding:4px 8px}
.ws .mark{width:22px;height:22px;border-radius:4px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ws .name{font-weight:600;color:var(--ink);font-size:14px;flex:1;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--danger)}
.search{display:flex;padding:0 4px}
.search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--bg)}
.sec-title{font-size:12px;font-weight:600;color:var(--muted);padding:0 8px 2px}
.list{display:flex;flex-direction:column;gap:1px}
.item{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:transparent;border-radius:5px;padding:3px 8px;min-height:28px;cursor:pointer;font-size:14px;color:var(--side-ink)}
.item:hover{background:var(--hover-2)}
.item.active{background:var(--hover-2);color:var(--ink);font-weight:600}
.item .ic{width:20px;flex:none;text-align:center}
.item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{display:block;font-size:11px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.new{color:var(--muted)}
.sec-title.row{display:flex;align-items:center;justify-content:space-between}
.sec-title .mini{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:4px;padding:0 6px;font-size:14px}
.sec-title .mini:hover{background:var(--hover-2);color:var(--ink)}
.trow{display:flex;align-items:center}
.trow .item{flex:1;min-width:0;padding-left:2px}
.tg{flex:none;width:20px;height:24px;border:0;background:transparent;color:var(--faint);cursor:pointer;border-radius:4px;font-size:10px;padding:0}
.tg:hover{background:var(--hover-2);color:var(--ink)}
.tg.sp{cursor:default;pointer-events:none}
.tg.rm{width:22px;opacity:0;font-size:11px}
.trow:hover .tg.rm,.tg.rm:focus-visible{opacity:1}
@media (hover:none){.tg.rm{opacity:1}}
.share-add{display:flex;flex-direction:column;gap:4px;padding:2px 4px 6px}
.share-add input{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--bg);min-width:0}
.share-add .item[disabled]{opacity:.55;cursor:default}
.tkids{padding-left:14px}
.tkids .note{padding:2px 8px 2px 8px;font-size:12px}
.note{font-size:13px;color:var(--muted);padding:4px 8px}
.err{font-size:13px;color:var(--danger);padding:6px 8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}

/* top bar */
.top{display:flex;align-items:center;gap:6px;height:45px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:1;overflow:hidden;font-size:14px;white-space:nowrap}
.crumbs button{border:0;background:none;cursor:pointer;padding:2px 6px;border-radius:4px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:180px}
.crumbs button:hover{background:var(--hover)}
.crumbs .sep{color:var(--faint)}
.crumbs .self{padding:2px 6px;overflow:hidden;text-overflow:ellipsis}
.save{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.save.bad{color:var(--danger);white-space:nowrap}
.menu-toggle{display:none}

/* page */
.main{overflow-y:auto;min-width:0}
.wrap{max-width:900px;margin:0 auto;padding-block:40px 30vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
@media (min-width:900px){.wrap{padding-left:max(96px,env(safe-area-inset-left,0px));padding-right:max(96px,env(safe-area-inset-right,0px))}}
.pg-icon{font-size:72px;line-height:1.1}
.title{font-size:40px;font-weight:700;line-height:1.2;margin:0;outline:none;overflow-wrap:anywhere;text-wrap:balance;cursor:text}
.title:empty::before{content:attr(data-ph);color:var(--faint)}
.pg-meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;color:var(--muted)}
.props{display:grid;grid-template-columns:minmax(90px,max-content) minmax(0,1fr);gap:4px 16px;font-size:14px;padding-block:6px;border-bottom:1px solid var(--line)}
.props dt{color:var(--muted)} .props dd{margin:0;overflow-wrap:anywhere}
.lock{font-size:13px;color:var(--muted);background:var(--hl-gray);border-radius:4px;padding:8px 10px}

.chip{display:inline-block;padding:0 6px;border-radius:3px;font-size:12px;background:var(--hl-gray);white-space:nowrap}
.chip.c-gray{background:var(--hl-gray)} .chip.c-brown{background:var(--hl-brown)} .chip.c-orange{background:var(--hl-orange)}
.chip.c-yellow{background:var(--hl-yellow)} .chip.c-green{background:var(--hl-green)} .chip.c-blue{background:var(--hl-blue)}
.chip.c-purple{background:var(--hl-purple)} .chip.c-pink{background:var(--hl-pink)} .chip.c-red{background:var(--hl-red)}

/* blocks */
.doc{font-size:16px;line-height:1.5;overflow-wrap:anywhere;display:flex;flex-direction:column;margin-top:8px}
.blk{position:relative;padding:3px 2px;min-height:30px;border-radius:3px}
.blk.can{cursor:text}
.blk .handle{position:absolute;left:-30px;top:3px;width:24px;height:24px;border:0;border-radius:4px;background:transparent;color:var(--faint);font-size:18px;line-height:1;cursor:pointer;opacity:0;display:none}
@media (min-width:900px) and (hover:hover){.blk .handle{display:block}}
.blk:hover .handle{opacity:1}
.blk .handle:hover{background:var(--hover-2);color:var(--muted)}
.blk-edit{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;padding:0;margin:0;font:inherit;line-height:1.5;color:var(--ink);overflow:hidden;min-height:1.5em;caret-color:var(--ink)}
.blk-edit::placeholder{color:var(--faint)}
.blk.editing{box-shadow:inset 2px 0 0 var(--accent);padding-left:10px;margin-left:-10px;background:var(--hover)}
.blk.editing.code .blk-edit{font-family:var(--f-mono);font-size:14px}
.doc h2{font-size:1.875em;font-weight:600;line-height:1.3;margin:.6em 0 0} .doc h3{font-size:1.5em;font-weight:600;line-height:1.3;margin:.5em 0 0} .doc h4{font-size:1.25em;font-weight:600;line-height:1.3;margin:.4em 0 0}
.doc p{margin:0} .doc ul,.doc ol{margin:0;padding-left:1.6em}
.doc li{margin:1px 0}
.doc ul.todo{list-style:none;padding-left:0}
.doc li.chk{display:block;position:relative;padding-left:26px}
.doc li.chk>.box{position:absolute;left:2px;top:.3em;width:16px;height:16px;border:1.5px solid var(--ink);border-radius:2px;cursor:pointer}
.doc li.chk.done>.box{background:var(--accent);border-color:var(--accent)}
.doc li.chk.done>.box::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.doc li.chk.done>.txt{color:var(--muted);text-decoration:line-through}
.doc blockquote{margin:0;padding:0 0 0 14px;border-left:3px solid currentColor;font-size:1.05em}
.doc pre{background:var(--hl-gray);padding:24px 16px;border-radius:4px;overflow-x:auto;font-family:var(--f-mono);font-size:14px;margin:4px 0}
.doc code{font-family:var(--f-mono);font-size:.85em;background:var(--hl-gray);color:var(--tx-red);padding:2px 4px;border-radius:3px}
.doc pre code{background:none;padding:0;color:inherit}
.doc hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.doc .tbl{overflow-x:auto} .doc table{border-collapse:collapse;font-size:14px} .doc td,.doc th{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.doc .callout{display:flex;gap:10px;background:var(--hl-gray);padding:14px 16px;border-radius:4px}
.doc .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}
.doc summary{cursor:pointer}
.doc .unk{font-size:13px;color:var(--muted);font-style:italic}
.doc a{color:inherit;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:2px}
.link-int{border:0;background:none;color:inherit;cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:2px;font:inherit;font-weight:500}
.block-link{display:flex;align-items:center;gap:6px;padding:2px 2px;border-radius:3px;border:0;background:transparent;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit;font-weight:500;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.block-link:hover{background:var(--hover)}
.c-gray{color:var(--tx-gray)} .c-brown{color:var(--tx-brown)} .c-orange{color:var(--tx-orange)} .c-yellow{color:var(--tx-yellow)}
.c-green{color:var(--tx-green)} .c-blue{color:var(--tx-blue)} .c-purple{color:var(--tx-purple)} .c-pink{color:var(--tx-pink)} .c-red{color:var(--tx-red)}
.bg-gray{background:var(--hl-gray)} .bg-brown{background:var(--hl-brown)} .bg-orange{background:var(--hl-orange)} .bg-yellow{background:var(--hl-yellow)}
.bg-green{background:var(--hl-green)} .bg-blue{background:var(--hl-blue)} .bg-purple{background:var(--hl-purple)} .bg-pink{background:var(--hl-pink)} .bg-red{background:var(--hl-red)}
.tail{min-height:120px;cursor:text}
.empty-hint{color:var(--faint);padding:3px 2px;cursor:text}

/* slash menu */
.slash{position:absolute;left:0;top:100%;z-index:6;margin-top:4px;width:min(300px,100%);max-height:320px;overflow-y:auto;background:var(--menu);border-radius:6px;box-shadow:0 0 0 1px var(--line),0 6px 20px var(--shadow);padding:6px 0;font-size:14px}
.slash .cap{font-size:12px;color:var(--muted);padding:2px 12px 6px}
.slash .opt{display:flex;align-items:center;gap:10px;padding:5px 12px;cursor:pointer}
.slash .opt .sym{width:28px;height:28px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--bg);flex:none}
.slash .opt[aria-selected="true"]{background:var(--hover-2)}

/* database */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.seg{display:inline-flex;gap:2px}
.seg button{border:0;background:transparent;padding:4px 8px;cursor:pointer;font-size:14px;border-radius:4px;color:var(--muted)}
.seg button[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink);border-radius:0}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 4px;cursor:pointer}
.row:hover{background:var(--hover)}
.row .rt{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rd{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .rx{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
.cal-head{display:flex;align-items:center;gap:6px}
.cal-head h2{margin:0 6px 0 0;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day{min-height:100px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.day:hover{background:var(--hover)}
.day.out{background:var(--hover)} .day.out .dn{opacity:.5}
.day .dn{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.day.today .dn{background:var(--danger);color:#FFFFFF;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;align-self:flex-end}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.ev{display:block;width:100%;border:0;text-align:left;font-size:12px;line-height:1.5;padding:2px 6px;border-radius:3px;background:var(--bg);box-shadow:0 0 0 1px var(--line),0 1px 2px var(--shadow);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:inherit}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.day-list h3{font-size:15px;margin:0 0 6px}
.form{border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select{border:1px solid var(--line);border-radius:5px;padding:5px 8px;background:var(--bg);color:var(--ink);min-width:0}
.form .full{grid-column:1/-1}
.form .acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.form .msg{flex:1;font-size:13px;color:var(--danger)}

/* database table */
.wrap.wide{max-width:none}
.dbbody{display:flex;flex-direction:column;gap:14px;min-width:0}
.db-q{border:1px solid var(--line);border-radius:5px;padding:3px 8px;background:var(--bg);width:200px;max-width:100%;min-width:0}
.sortctl{display:inline-flex;align-items:center;gap:6px}
.sortctl select{border:1px solid var(--line);border-radius:5px;padding:3px 6px;background:var(--bg);color:var(--ink);max-width:160px}
.gridwrap{overflow-x:auto;min-width:0;padding-bottom:4px}
table.grid{border-collapse:separate;border-spacing:0;font-size:14px;table-layout:fixed}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;vertical-align:top;background:var(--bg)}
.grid th:last-child,.grid td:last-child{border-right:0}
.grid thead th{border-top:1px solid var(--line);position:sticky;top:0;z-index:2;font-weight:400;color:var(--muted);text-align:left}
.grid th>button{display:flex;gap:6px;align-items:center;width:100%;border:0;background:transparent;padding:7px 8px;cursor:pointer;color:inherit;text-align:left;font-size:14px}
.grid th>button:hover{background:var(--hover)}
.grid .tsym{font-family:var(--f-mono);font-size:11px;color:var(--faint);flex:none;min-width:14px}
.grid .th-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid .sort{color:var(--accent);font-weight:700}
.grid td:first-child,.grid th:first-child{position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line)}
.grid thead th:first-child{z-index:3}
.grid td.ed{cursor:text} .grid td.ro .cv{color:var(--muted)}
.grid td:hover{background-image:linear-gradient(var(--hover),var(--hover))}
.grid td:focus{outline:2px solid var(--accent);outline-offset:-2px}
.grid .cv{display:flex;gap:4px;align-items:center;min-height:34px;padding:6px 8px;overflow:hidden;white-space:nowrap}
.grid .cv .ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.grid .cv a{color:inherit;overflow:hidden;text-overflow:ellipsis}
.open-btn{flex:none;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;background:var(--bg);color:var(--muted);cursor:pointer;opacity:0}
.grid tr:hover .open-btn,.open-btn:focus-visible{opacity:1}
@media (hover:none){.open-btn{opacity:1}}

<script>
/* replaceChildren() turns null into the text "null": drop empty slots so optional pieces can be passed as null */
{ const orig = Element.prototype.replaceChildren;
  Element.prototype.replaceChildren = function(...kids){ return orig.apply(this, kids.filter(k => k != null && k !== false)); }; }
const SERVER = "Notion";
const READ = {cache:{staleTime:60000, gcTime:600000}};
let mcp = null;
let privPages = [], recentPages = [];
const hist = [];
let current = null;

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const $ = id => document.getElementById(id);
function store(k, v){ try{ v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function toast(msg){ const t = h("div",{class:"toast",role:"status",text:msg}); document.body.append(t); setTimeout(()=>t.remove(), 2800); }
function idOf(u){
  if (!u) return null;
  const s = String(u).replace(/[{}]/g,"");
  if (s.startsWith("collection://")) return s;
  const m = s.replace(/-/g,"").match(/[0-9a-f]{32}/i);
  return m ? m[0].toLowerCase() : null;
}
function iconFor(item){
  const ic = item.icon;
  if (typeof ic === "string" && ic && !ic.startsWith("/") && !ic.startsWith("http") && !ic.startsWith("icons/")) return ic;
  if (ic && ic.emoji) return ic.emoji;
  return item.type === "database" ? "▦" : "📄";
}
function stripLeadingEmoji(title, icon){
  if (icon && title && title.startsWith(icon)) return title.slice(icon.length).trim();
  return title;
}
const DOW = ["일","월","화","수","목","금","토"];
function pad(n){ return String(n).padStart(2,"0"); }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fmtDate(s){
  if (!s) return "";
  const dOnly = /^\d{4}-\d{2}-\d{2}$/.test(s);
  const d = dOnly ? new Date(s+"T00:00:00") : new Date(s);
  if (isNaN(d)) return s;
  let out = d.getFullYear()+". "+(d.getMonth()+1)+". "+d.getDate()+". ("+DOW[d.getDay()]+")";
  if (!dOnly) out += " "+pad(d.getHours())+":"+pad(d.getMinutes());
  return out;
}
function dayKey(s){ if (!s) return null; if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; const d = new Date(s); return isNaN(d) ? s.slice(0,10) : ymd(d); }

/* ---------- connector calls ---------- */
function normPayload(r){
  let p = r && r.payload !== undefined ? r.payload : r;
  if (typeof p === "string"){ try{ p = JSON.parse(p); }catch(e){} }
  return p;
}
const QREAD = {cache:{staleTime:600000, gcTime:3600000}};
async function read(tool, input, fresh, base){
  if (!mcp) throw {code:"capability_disabled"};
  base = base || READ;
  const opts = fresh ? {cache:{...base.cache, refresh:true}} : base;
  return normPayload(await mcp.callTool(SERVER, tool, input, opts));
}
async function write(tool, input){
  if (!mcp) throw {code:"capability_disabled"};
  return normPayload(await mcp.callTool(SERVER, tool, input, {cache:false}));
}
function errInfo(e){
  const code = e && e.code;
  if (/allowance|used up/i.test(String((e && e.message) || "")))
    return {msg:"Notion의 데이터베이스 조회 한도(1시간 단위)를 다 썼어요. 60분 안에 다시 채워지니 잠시 뒤 ‘새로고침’을 눌러 주세요. 이미 열어 본 표는 그대로 볼 수 있어요.", retry:true};
  switch(code){
    case "needs_reauth": return {msg:"Notion 로그인이 만료됐어요. claude.ai 설정 → 커넥터에서 Notion을 다시 연결해 주세요.", retry:false};
    case "server_not_connected": return {msg:"Notion이 연결되어 있지 않아요. claude.ai 설정 → 커넥터에서 Notion을 추가한 뒤 이 페이지를 새로고침해 주세요.", retry:false};
    case "selection_required": return {msg:"Notion 연결이 여러 개예요. 화면에 뜬 선택 창에서 사용할 연결을 골라 주세요.", retry:true};
    case "not_in_manifest": return {msg:"이 앱의 Notion 접근이 꺼져 있어요. 앱 상단의 권한 메뉴에서 Notion을 허용해 주세요.", retry:false};
    case "approval_required": case "consent_required": return {msg:"Notion 접근을 허용해야 노트를 불러올 수 있어요.", retry:true, label:"Notion 접근 허용하기"};
    case "blocked_by_policy": return {msg:"조직 정책으로 이 Notion 기능이 막혀 있어요.", retry:false};
    case "server_unavailable": case "rate_limited": return {msg:"Notion이 잠시 응답하지 않아요. 잠시 뒤 다시 시도해 주세요.", retry:true};
    case "tool_error": return {msg:"Notion이 요청을 처리하지 못했어요: "+String(e.message||"").slice(0,400), retry:true};
    case "capability_disabled": case "not_granted": case "capability_removed":
      return {msg:"이 화면에서는 Notion 연결을 쓸 수 없어요. claude.ai에서 이 앱을 열어 주세요.", retry:false};
    default: return {msg:"Notion에서 처리하지 못했어요. 다시 시도해 주세요.", retry:true};
  }
}
function errBox(e, onRetry){
  const info = errInfo(e);
  const vm = e && e.viewErr ? String(e.viewErr.message || e.viewErr.code || "").slice(0,300) : "";
  return h("div",{class:"err"}, info.msg,
    vm ? h("span",{class:"meta"}, "보기 모드 조회도 실패했어요: "+vm) : null,
    info.retry && onRetry ? h("button",{class:"btn",type:"button",onclick:onRetry}, info.label||"다시 시도") : null);
}
function setStatus(state, label){
  $("dot").className = "dot" + (state==="ok"?" ok":state==="bad"?" bad":"");
  $("dot").title = label;
}

/* ---------- sidebar ---------- */
function sideItem(it){
  const icon = iconFor(it);
  const title = stripLeadingEmoji(it.title || "제목 없음", icon);
  const id = idOf(it.url || it.id);
  return h("button",{class:"item"+(current && current.id===id?" active":""), type:"button", "data-id":id, onclick:()=>{ open(it.url||it.id, it.type); closeMenu(); }},
    h("span",{class:"ic","aria-hidden":"true"}, icon),
    h("span",{class:"t"}, title, it.path ? h("span",{class:"sub"}, it.path) : null));
}
function fillList(el, items, empty){
  el.replaceChildren(...(items.length ? items.map(sideItem) : [h("div",{class:"note"}, empty)]));
}
/* tree: children are read from each page's own content the first time a node is expanded,
   then remembered (memory + browser storage) so reopening costs no Notion calls */
const pins = load("pins") || [];
const treeOpen = new Set(load("treeOpen") || []);
const kidMem = {};
const KID_TTL = 12*3600*1000;
let sharedPages = [];
function parseKids(content){
  const out = [], seen = new Set();
  const re = /<(page|database)\b([^>]*)>([\s\S]*?)<\/\1>/g;
  let m;
  while ((m = re.exec(content || ""))){
    const um = /(?:^|\s)url="([^"]*)"/.exec(m[2]);
    const id = um ? idOf(um[1]) : null;
    if (!id || seen.has(id)) continue;
    seen.add(id);
    let t = m[3].replace(/<[^>]*>/g, "").trim();
    const am = /(?:^|\s)icon="([^"]*)"/.exec(m[2]);
    let icon = am && am[1] && !/^(\/|https?:|icons\/)/.test(am[1]) ? am[1] : null;
    const em = /^\p{Extended_Pictographic}️?/u.exec(t);
    if (em){ icon = icon || em[0]; t = t.slice(em[0].length).trim(); }
    /* Notion leaves the title out of untitled-looking blocks (e.g. databases): title "" means "look it up" */
    out.push({id, url:um[1], type:m[1], title:t, icon});
  }
  return out;
}
function kidsCached(id){
  const m = kidMem[id];
  if (m && Date.now() - m.at < KID_TTL) return m.items;
  const ls = load("k:"+id);
  if (ls && Array.isArray(ls.items) && Date.now() - ls.at < KID_TTL){ kidMem[id] = ls; return ls.items; }
  return null;
}
function setKids(id, items){ const v = {at:Date.now(), items}; kidMem[id] = v; store("k:"+id, v); }
function dropKids(id){
  delete kidMem[id]; store("k:"+id);
  document.querySelectorAll('.tnode[data-nid="'+id+'"]').forEach(w => syncNode(w, id));
}
function forgetAllKids(){
  for (const k of Object.keys(kidMem)) delete kidMem[k];
  try{ Object.keys(localStorage).filter(k => k.startsWith("k:")).forEach(k => localStorage.removeItem(k)); }catch(e){}
}
async function loadKids(id, fresh){
  if (!fresh){ const c = kidsCached(id); if (c) return c; }
  const p = await read("notion-fetch", {id}, fresh, TREAD);
  const items = parseKids(between((p && p.text) || "", "content") || "");
  setKids(id, items);
  return items;
}
function paintKids(wrap, id, items){
  const kidsEl = wrap.querySelector(":scope>.tkids");
  if (!items.length){ kidsEl.replaceChildren(h("div",{class:"note"},"하위 페이지 없음")); return; }
  kidsEl.replaceChildren(...items.map(n => drawNode(n)));
}
function syncNode(wrap, id){
  const tg = wrap.querySelector(":scope>.trow>.tg"), kidsEl = wrap.querySelector(":scope>.tkids");

  if (tg && tg.tagName === "BUTTON"){ tg.textContent = isOpen ? "▾" : "▸"; tg.setAttribute("aria-expanded", String(isOpen)); }
  kidsEl.hidden = !isOpen;
  if (!isOpen) return;
  const c = kidsCached(id);
  if (c){ paintKids(wrap, id, c); return; }
  kidsEl.replaceChildren(h("div",{class:"skel"}));
  loadKids(id).then(items => { if (treeOpen.has(id)) paintKids(wrap, id, items); })
    .catch(e => { kidsEl.replaceChildren(errBox(e, () => syncNode(wrap, id))); });
}
function drawNode(node, onRemove){
  const id = idOf(node.url || node.id);

    else out.push("<p>"+inline(t)+"</p>");
  }

  return out.join("\n");
}
const KEEP = new Set(["p","ul","ol","li","b","strong","i","em","u","s","del","code","pre","h2","h3","h4","blockquote","br","hr","span","a","table","thead","tbody","tr","td","th","details","summary","div","colgroup","col"]);

function colorClass(c){
  if (!c) return "";
  const m = c.match(/^([a-z]+?)(_background|_bg)?$/);

function cleanNode(node){
  const frag = document.createDocumentFragment();
  for (const n of Array.from(node.childNodes)){
    if (n.nodeType === 3){ frag.append(document.createTextNode(n.textContent)); continue; }
    if (n.nodeType !== 1) continue;
    const tag = n.tagName.toLowerCase();
    const url = n.getAttribute("url");
    if (tag === "page" || tag === "database"){
      let label = n.textContent.trim();
      const bid = idOf(url);
      let lookup = false;
      const attrIc = n.getAttribute("icon");
      let ic = attrIc && !/^(\/|https?:|icons\/)/.test(attrIc) ? attrIc : null;
      if (!label && bid){
        /* untitled-looking blocks (databases especially): look the title up once and remember it */
        const known = relTitle(bid);
        if (known){ const s = splitTitle(known); label = s.title; if (!ic && s.icon) ic = s.icon; }
        else { label = "…"; lookup = true; }
      }
      if (!label) label = tag==="database"?"데이터베이스":"제목 없는 페이지";
      frag.append(h("button",{class:"block-link",type:"button",onclick:()=>open(url, tag)},
        h("span",{"aria-hidden":"true","data-iid":lookup ? bid : null}, ic || (tag==="database"?"▦":"📄")),
        h("span",{"data-tid":lookup ? bid : null}, label)));
      continue;
    }
    if (tag === "mention-page" || tag === "mention-database"){
      frag.append(h("button",{class:"link-int",type:"button",onclick:()=>open(url, tag==="mention-database"?"database":"page")}, n.textContent.trim() || "페이지"));
      continue;
    }
    if (tag === "mention-date"){ const s = n.getAttribute("start"), e = n.getAttribute("end"); frag.append(h("span",{class:"c-blue"}, fmtDate(s) + (e ? " → "+fmtDate(e) : ""))); continue; }
    if (tag === "mention-user"){ frag.append(h("span",{class:"c-gray"},"@사용자")); continue; }
    if (tag === "empty-block"){ frag.append(h("br")); continue; }
    if (tag === "unknown"){ const alt = n.getAttribute("alt"); frag.append(h("div",{class:"unk"}, alt==="ai_block" ? "(AI 블록: Notion에서만 보여요)" : "(이 앱에서 표시할 수 없는 블록)")); continue; }
    if (tag === "callout"){ const d = h("div",{class:"callout "+colorClass(n.getAttribute("color"))}); const ic = n.getAttribute("icon"); if (ic && !ic.startsWith("/") && !ic.startsWith("http")) d.append(h("span",{"aria-hidden":"true"}, ic)); d.append(h("div",null, cleanNode(n))); frag.append(d); continue; }
    if (tag === "columns"){ frag.append(h("div",{class:"cols"}, cleanNode(n))); continue; }
    if (tag === "column"){ frag.append(h("div",null, cleanNode(n))); continue; }
    if (tag === "table"){ const tb = document.createElement("table"); tb.append(cleanNode(n)); frag.append(h("div",{class:"tbl"}, tb)); continue; }
    if (!KEEP.has(tag)){ frag.append(cleanNode(n)); continue; }

    const cls = [n.getAttribute("class") || ""].filter(c => /^(todo|chk|done|box|txt)( |$)/.test(c)).join(" ");
    const cc = colorClass(n.getAttribute("color"));
    if (cls || cc) el.className = (cls+" "+cc).trim();
    if (tag === "li" && /^\d+$/.test(n.getAttribute("data-ln") || "")) el.dataset.ln = n.getAttribute("data-ln");
    if (tag === "a"){
      const href = n.getAttribute("href") || "";
      const pid = /notion\.(so|com)|^\//.test(href) ? idOf(href) : null;
      if (pid){ frag.append(h("button",{class:"link-int",type:"button",onclick:()=>open(pid,"page")}, n.textContent)); continue; }
      if (/^https?:\/\//i.test(href)){ el.href = href; el.target = "_blank"; el.rel = "noopener noreferrer"; }
    }
    if ((tag === "td" || tag === "th") && n.getAttribute("colspan")) el.setAttribute("colspan", n.getAttribute("colspan"));
    el.append(cleanNode(n));
    frag.append(el);
  }
  return frag;
}
function renderNotionMarkdown(md){
  const fixed = md.replace(/<([a-z][a-z0-9-]*)((?:\s[^<>]*?)?)\s*\/>/gi, (all, t, a) => (t.toLowerCase()==="br"||t.toLowerCase()==="hr") ? "<"+t+">" : "<"+t+a+"></"+t+">");
  const html = mdToHtml(fixed);
  const parsed = new DOMParser().parseFromString("<div>"+html+"</div>", "text/html");
  return cleanNode(parsed.body.firstChild || parsed.body);
}

/* ---------- page editor ---------- */
let page = null;            // {id, title, titleKey, blocks, editable, saved, dirty, saving, failed, again}
let editIdx = null, activeTa = null, caretAt = null;
let saveTimer = null, updSchema;
const freshIds = new Set();

function lockedRaw(raw){ return /<(page|database|unknown)\b/.test(raw); }
function snapshot(pg){
  return pg.blocks
    .map((b,i) => (pg === page && i === editIdx && activeTa) ? activeTa.value : b.raw)
    .filter((r,i) => !(pg.blocks[i].isNew && r.trim() === ""))

}
async function updateSchema(){
  if (updSchema !== undefined) return updSchema;
  try{ const d = mcp.describeTool ? await mcp.describeTool(SERVER, "notion-update-page") : null; updSchema = (d && d.inputSchema) || null; }
  catch(e){ updSchema = null; }
  return updSchema;
}
/* notion-update-page takes page_id/command at the top level; wrap in {data} only if the schema says so */
function wrapArgs(s, args){
  const p = s && s.properties;
  return (p && p.data && !p.page_id) ? {data: args} : args;
}
let updCmds = null;
async function contentInput(id, md, old){
  const s = await updateSchema();
  const p = s && s.properties;
  const inner = p ? ((p.data && p.data.properties) || p) : null;
  const cmds = updCmds || (inner && inner.command && inner.command.enum);
  let args;
  if (cmds && !cmds.includes("replace_content") && cmds.includes("update_content"))
    args = {page_id:id, command:"update_content", content_updates:[{old_str: old, new_str: md}]};

}
/* learn the allowed commands from Notion's validation message, once */
function learnCommands(e){
  const m = /command: Invalid option: expected one of ([^\n]*)/.exec(String((e && e.message) || ""));
  if (!m) return false;
  const opts = [...m[1].matchAll(/"([a-z_]+)"/g)].map(x => x[1]);
  if (!opts.length || (updCmds && updCmds.join() === opts.join())) return false;
  updCmds = opts;
  return true;
}
async function writeContent(pg, md){
  try{ return await write("notion-update-page", await contentInput(pg.id, md, pg.saved)); }
  catch(e){
    if (e && e.code === "tool_error" && learnCommands(e)) return await write("notion-update-page", await contentInput(pg.id, md, pg.saved));
    throw e;
  }
}
function setSave(state, e, retry){
  const el = $("save");
  el.className = "save";
  if (state === "pending") el.replaceChildren("편집 중");
  else if (state === "saving") el.replaceChildren("저장 중…");
  else if (state === "saved") el.replaceChildren("저장됨");
  else if (state === "error"){
    const info = errInfo(e);
    el.className = "save bad";
    el.title = info.msg;
    el.replaceChildren("저장 실패", retry ? h("button",{class:"btn",type:"button",onclick:retry},"다시 저장") : null);
    toast(info.msg);

}
function markDirty(delay){

}
async function saveNow(target){
  const pg = target || page;

  if (!pg || !pg.dirty) return;
  if (pg.saving){ pg.again = true; return; }
  const md = snapshot(pg);
  if (md === pg.saved){ pg.dirty = false; if (page === pg) setSave("saved"); return; }
  pg.saving = true; pg.dirty = false;
  setSave("saving");
  try{
    await writeContent(pg, md);
    pg.saved = md; freshIds.add(pg.id);
    if (page === pg && !pg.dirty) setSave("saved");
  }catch(e){
    pg.dirty = true; pg.failed = true;
    if (page === pg) setSave("error", e, ()=>{ pg.failed = false; saveNow(pg); });
    else toast("‘"+(pg.title||"제목 없음")+"’ 저장에 실패했어요. Notion에서 확인해 주세요.");

async function leavePage(){

}
addEventListener("pagehide", ()=>{ if (activeTa) finishEdit(); if (page && page.dirty) saveNow(); });

async function saveTitle(t){
  const pg = page;
  if (!pg || t === pg.title) return;
  const prev = pg.title; pg.title = t;
  setSave("saving");
  try{
    const s = await updateSchema();
    await write("notion-update-page", wrapArgs(s, {page_id: pg.id, command:"update_properties", properties:{[pg.titleKey]: t}}));
    freshIds.add(pg.id);
    if (page === pg) setSave("saved");
    setCrumbsSelf(t || "제목 없음");
    loadSidebar(true);
  }catch(e){
    pg.title = prev;
    if (page === pg) setSave("error", e, ()=>saveTitle(t));

}
function setCrumbsSelf(t){ const s = $("crumbs").querySelector(".self"); if (s) s.textContent = t; }

function renderPage(p, id){

  const titleKey = Object.keys(props).find(k => props[k] === rawTitle || props[k] === title) || "title";
  const pl = propsList(props).filter(([k]) => k !== titleKey);

function visible(i){ const b = page.blocks[i]; return b && (!b.blank || i === editIdx); }
function canEdit(i){ const b = page.blocks[i]; return page.editable && b && !b.blank && !lockedRaw(b.raw); }

function nextIdx(i){ for (let k = i+1; k < page.blocks.length; k++) if (canEdit(k)) return k; return null; }

function renderDoc(){
  const doc = $("doc");
  if (!doc || !page) return;
  const kids = [];
  let olCount = 0;
  page.blocks.forEach((b, i)=>{
    if (i === editIdx){ kids.push(editorFor(i)); olCount = 0; return; }
    if (b.blank) return;
    const box = h("div",{class:"blk"+(canEdit(i)?" can":""),"data-i":i});
    box.append(renderNotionMarkdown(b.raw));
    const first = box.firstElementChild;
    if (first && first.tagName === "OL"){ olCount++; first.start = olCount; } else olCount = 0;
    if (page.editable) box.append(h("button",{class:"handle",type:"button",title:"아래에 블록 추가","aria-label":"아래에 블록 추가",onclick:ev=>{ ev.stopPropagation(); insertAfter(i, ""); }},"+"));
    /* mousedown (not click) so the open editor never blurs and re-renders under the pointer */
    box.addEventListener("mousedown", ev=>{
      if (ev.button !== 0) return;
      if (ev.target.closest(".box")){ ev.preventDefault(); return; }
      if (ev.target.closest("a,button,summary,input,.tbl")) return;
      if (canEdit(i)){ ev.preventDefault(); startEdit(i, "end"); }
    });
    box.addEventListener("click", ev=>{
      const boxEl = ev.target.closest(".box");
      if (boxEl && page.editable && !lockedRaw(b.raw)){ const li = boxEl.closest("li[data-ln]"); if (li) toggleTodo(i, +li.dataset.ln); }
    });
    if (canEdit(i)){
      box.tabIndex = 0;
      box.addEventListener("keydown", ev=>{ if (ev.key === "Enter" && ev.target === box){ ev.preventDefault(); startEdit(i, "end"); } });
    }
    kids.push(box);
  });

    ? h("div",{class:"empty-hint",onclick:()=>appendBlock()},"내용이 없어요. 여기를 눌러 쓰기 시작하세요.")
    : h("p",{class:"meta"},"내용이 없는 페이지예요."));

  if (ta && ta.isConnected){
    autosize(ta);
    ta.focus({preventScroll:true});

function toggleTodo(i, ln){
  i = leaveEditor(i);
  editIdx = null;
  const b = page.blocks[i];
  const lines = b.raw.split("\n");
  if (lines[ln] == null) return;
  lines[ln] = lines[ln].replace(/\[( |x|X)\]/, m => m === "[ ]" ? "[x]" : "[ ]");
  b.raw = lines.join("\n");
  renderDoc();
  markDirty(500);
}

/* commit text into block i; returns true when the block was removed */
function commit(i, v){
  const b = page.blocks[i];
  if (!b) return false;
  if (v.trim() === ""){
    page.blocks.splice(i, 1);
    if (!b.isNew) markDirty();
    return true;
  }
  const changed = v !== b.raw || b.isNew;

}
function detach(){ const ta = activeTa; activeTa = null; closeSlash(); return ta ? ta.value : null; }

function cancelEdit(){

/* leave the current editor (if any) and return target index adjusted for a removed block */
function leaveEditor(target){

}
function startEdit(i, caret){

}
function insertAfter(i, raw){

function appendBlock(){

}
function autosize(ta){ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

function editorFor(i){
  const raw = page.blocks[i].raw;
  const ta = h("textarea",{class:"blk-edit",id:"blk-edit",rows:"1",spellcheck:"false","aria-label":"블록 편집",placeholder:"글을 쓰거나 ‘/’를 눌러 블록 종류를 고르세요"});
  ta.value = raw;
  const box = h("div",{class:"blk editing"+(raw.trimStart().startsWith("```")?" code":"")}, ta);
  ta.addEventListener("input", ()=>{ autosize(ta); updateSlash(ta); markDirty(1500); });
  ta.addEventListener("keydown", ev=>onEditKey(ev, ta));
  ta.addEventListener("blur", ()=>{ if (activeTa === ta) finishEdit(); });

const LIST_RE = /^(\s*)(- \[[ xX]\] |[-*+] |(\d+)\. |> )/;
function onEditKey(ev, ta){
  if (ev.isComposing || ev.keyCode === 229) return;
  if (slash.open && slashKey(ev, ta)) return;
  const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
  const cur = editIdx;
  if (ev.key === "Escape"){ ev.preventDefault(); ta.blur(); return; }
  if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)){ ev.preventDefault(); ta.blur(); return; }
  if (ev.key === "Enter" && !ev.shiftKey && !v.includes("\n") && !v.trimStart().startsWith("```") && !v.trimStart().startsWith("<")){
    ev.preventDefault();
    const m = LIST_RE.exec(v);
    if (m && v.slice(m[0].length).trim() === ""){ ta.value = ""; autosize(ta); markDirty(); return; }
    let prefix = "";
    if (m){
      if (m[2].startsWith("- [")) prefix = m[1] + "- [ ] ";
      else if (m[3]) prefix = m[1] + (Number(m[3]) + 1) + ". ";
      else if (m[2] !== "> ") prefix = m[1] + m[2];
    }
    const before = v.slice(0, s), after = v.slice(e);
    detach();
    const removed = commit(cur, before);
    const at = removed ? cur : cur + 1;
    page.blocks.splice(at, 0, {raw: prefix + after, isNew: true});
    if (after.trim()) markDirty();
    editIdx = at; caretAt = prefix.length;
    renderDoc();
    return;
  }
  if (ev.key === "Backspace" && s === 0 && e === 0){
    const pm = /^(#{1,3} |- \[[ xX]\] |[-*+] |\d+\. |> )/.exec(v);
    if (pm){ ev.preventDefault(); ta.value = v.slice(pm[0].length); ta.setSelectionRange(0,0); autosize(ta); markDirty(); return; }
    const p = prevIdx(cur);
    if (v === ""){
      ev.preventDefault(); detach(); commit(cur, "");
      if (p != null){ editIdx = p; caretAt = page.blocks[p].raw.length; } else editIdx = null;
      renderDoc(); return;
    }
    if (p != null && p === cur - 1 && !page.blocks[p].raw.includes("\n") && !v.includes("\n") && !page.blocks[p].raw.trimStart().startsWith("<")){
      ev.preventDefault(); detach();
      const pos = page.blocks[p].raw.length;
      page.blocks[p].raw += v;
      page.blocks.splice(cur, 1);
      markDirty();
      editIdx = p; caretAt = pos;
      renderDoc(); return;
    }
    return;
  }
  if (ev.key === "ArrowUp" && !ev.shiftKey && !v.slice(0, s).includes("\n")){
    const p = prevIdx(cur); if (p == null) return;
    ev.preventDefault(); startEdit(p, "end"); return;
  }
  if (ev.key === "ArrowDown" && !ev.shiftKey && !v.slice(e).includes("\n")){
    const n = nextIdx(cur); if (n == null) return;
    ev.preventDefault(); startEdit(n, 0); return;
  }
}

/* ---------- slash menu ---------- */
const SLASH = [
  {k:"텍스트 text 문단", label:"텍스트", sym:"Aa", pre:""},

function createdId(r, exclude){

  if (Array.isArray(arr)) for (const x of arr) cand.push(idOf(x && (x.url || x.id)));
  const s = typeof r === "string" ? r : JSON.stringify(r || "");
  for (const m of s.matchAll(/[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}/gi)) cand.push(idOf(m[0]));

async function createPage(parentId){

/* ---------- column order and visibility: start from the Notion view, then remember local changes per view ---------- */
function orderedCols(ctx){
  const base = dbCols(ctx.info);
  const byName = new Map(base.map(c => [c.name, c]));
  const key = ctx.info.view || "_";
  const view = ctx.info.views.find(v => v.url === ctx.info.view);
  const ov = ctx.st.cols[key];
  let order, hidden;
  if (ov){
    order = (ov.order || []).filter(n => byName.has(n));
    for (const c of base) if (!order.includes(c.name)) order.push(c.name);
    hidden = new Set(ov.hidden || []);
  } else if (view && view.props){
    const vis = view.props.filter(n => byName.has(n));
    /* a calendar view lays rows out by its date property but does not list it as a column: show it anyway */
    if (view.calendarBy && byName.has(view.calendarBy) && !vis.includes(view.calendarBy)) vis.unshift(view.calendarBy);
    order = [...vis, ...base.map(c => c.name).filter(n => !vis.includes(n))];
    hidden = new Set(order.filter(n => !vis.includes(n)));
  } else {
    order = base.map(c => c.name); hidden = new Set();

  const titles = base.filter(c => c.type === "title").map(c => c.name);        // title is never hidden; it starts first (as in Notion) but can be moved
  if (!ov) order = [...titles, ...order.filter(n => !titles.includes(n))];
  titles.forEach(n => hidden.delete(n));
  const all = order.map(n => byName.get(n));
  return {all, visible: all.filter(c => !hidden.has(c.name)), hidden, custom: !!ov};

const IMPORTABLE = new Set(["title","text","number","select","status","multi_select","date","checkbox","url","email","phone_number","relation"]);
const normName = x => String(x).toLowerCase().replace(/\s+/g, " ").trim();

const ROW_CAP = 500, CHUNK = 25;
function decodeText(buf){

function dateOne(x){

    return {y:d.getUTCFullYear(), m:d.getUTCMonth()+1, d:d.getUTCDate(), hh:d.getUTCHours(), mm:d.getUTCMinutes(), t:!!(d.getUTCHours() || d.getUTCMinutes())};
  }
  const m = /(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})(?:\s*일)?(?:[ T]+(\d{1,2}):(\d{2}))?/.exec(String(x));
  if (!m) return null;
  const o = {y:+m[1], m:+m[2], d:+m[3], hh:+(m[4] || 0), mm:+(m[5] || 0), t:m[4] != null};

function dateIso(p, withTime){

function parseDateCell(v){

  if (typeof v === "string"){ const parts = v.split(/\s*(?:→|~|–|—)\s*/); a = parts[0]; b = parts[1] || null; }
  const p1 = dateOne(a); if (!p1) return null;

function convertCell(c, v, o, w){
  if (v == null) return null;
  const isDate = v instanceof Date;
  const s = isDate ? "" : String(v).trim();
  if (!isDate && s === "") return null;
  const optName = x => { const f = optionsOf(c).find(op => op.name.toLowerCase() === x.toLowerCase()); return f ? f.name : null; };
  switch (c.type){
    case "checkbox": return {[c.name]: (v === true || (typeof v === "number" && v !== 0) || /^(true|yes|y|1|✔|✓|v|checked|예|네|완료|체크)$/i.test(s)) ? "__YES__" : "__NO__"};

    case "multi_select": {

function openImport(ctx){

/* Notion hands rich text back with markup for line breaks (<br>, </br>, <p>…</p>) and escaped characters:

function plainText(v){

/* ---------- relation titles: linked page ids → titles, fetched a few at a time and remembered ---------- */
const TREAD = {cache:{staleTime:1800000, gcTime:3600000}};

const titleFail = new Set(), titleWait = new Set(), titleQ = [];
let titleActive = 0, titleSaveT = null;
function relTitle(id){
  if (titleCache[id] != null) return titleCache[id];
  if (titleFail.has(id)) return "열 수 없는 페이지";
  if (!titleWait.has(id) && mcp){ titleWait.add(id); titleQ.push(id); pumpTitles(); }
  return null;
}
function pumpTitles(){
  while (titleActive < 4 && titleQ.length){
    const id = titleQ.shift();
    titleActive++;
    read("notion-fetch", {id}, false, TREAD)
      .then(p => { const icon = p && p.icon && p.icon.emoji; titleCache[id] = (icon ? icon+" " : "") + (stripLeadingEmoji((p && p.title) || "", icon) || "제목 없음"); })
      .catch(() => { titleFail.add(id); })
      .finally(() => { titleActive--; titleWait.delete(id); paintTitle(id); saveTitles(); pumpTitles(); });
  }
}

  const em = /^\p{Extended_Pictographic}️?\s*/u.exec(s || "");

  const t = titleCache[id] != null ? titleCache[id] : "열 수 없는 페이지";
  document.querySelectorAll('[data-rid="'+id+'"]').forEach(b => { b.textContent = t; b.title = t; });
  const s = splitTitle(t);
  document.querySelectorAll('[data-tid="'+id+'"]').forEach(b => { b.textContent = s.title || t; b.closest(".item") && (b.closest(".item").title = s.title || t); });
  if (s.icon) document.querySelectorAll('[data-iid="'+id+'"]').forEach(b => { b.textContent = s.icon; });

    inp.focus();
    let busy = false;
    inp.addEventListener("keydown", async ev => {
      if (ev.isComposing || ev.keyCode === 229) return;
      if (ev.key === "Escape"){ ev.preventDefault(); busy = true; ctx.redraw(); return; }
      if (ev.key !== "Enter") return;
      ev.preventDefault();
      const t = inp.value.trim();
      if (!t || busy) return;
      busy = true; inp.disabled = true;
      try{
        const res = await write("notion-create-pages", {parent:{type:"data_source_id", data_source_id: ctx.info.sources[0].replace("collection://","")}, pages:[{properties:{[ctx.info.titleProp]: t}}], allow_async:false});
        toast("‘"+t+"’ 행을 추가했어요");
        ctx.addAgain = true;
        /* add the row locally instead of re-querying, to spare the hourly query allowance */
        const nid = createdId(res, ctx.info.sources[0].replace("collection://","").replace(/-/g,""));
        if (nid){ ctx.rows.unshift({url:"https://www.notion.so/"+nid, [ctx.info.titleProp]: t}); ctx.redrawAll(); }
        else await ctx.refetch();
      }catch(e){ busy = false; inp.disabled = false; inp.focus(); toast(errInfo(e).msg); }
    });
    inp.addEventListener("blur", () => { if (!busy && !inp.value.trim()) ctx.redraw(); });
  });
  td.append(btn);
  return h("tr", null, td);
}
function rowTitle(info, r){ return (info.titleProp && plainText(r[info.titleProp])) || "제목 없음"; }
function rowDate(info, r){ return info.dateProp ? r["date:"+info.dateProp+":start"] : null; }
function selectChip(info, r){
  const sp = info.selectProp; if (!sp || !r[sp.name]) return null;
  const opt = (sp.options||[]).find(o=>o.name===r[sp.name]);
  return h("span",{class:"chip c-"+((opt&&opt.color)||"gray")}, r[sp.name]);
}
function rowList(info, rows){
  if (!rows.length) return h("div",{class:"panel-msg"}, h("h2",{text:"아직 항목이 없어요"}), h("p",{text:"‘새로 만들기’로 첫 항목을 추가해 보세요."}));
  return h("div",{class:"rows"}, rows.map(r=>{
    const extras = info.textProps.map(k=>plainText(r[k])).filter(Boolean);
    const chip = selectChip(info, r);
    return h("button",{class:"row",type:"button",onclick:()=>open(r.url,"page")},
      h("span",{class:"rt"}, rowTitle(info, r)),
      h("span",{class:"rd"}, fmtDate(rowDate(info, r))),
      (chip || extras.length) ? h("span",{class:"rx"}, chip, extras.map(x=>h("span",null,x))) : null);
  }));
}
function calendar(info, st, rows, redraw){
  const byDay = {};
  for (const r of rows){
    const s = dayKey(rowDate(info, r)); if (!s) continue;
    const e = dayKey(r["date:"+info.dateProp+":end"]) || s;
    let d = new Date(s+"T00:00:00"); const end = new Date(e+"T00:00:00");
    for (let i=0; d <= end && i < 62; i++){ (byDay[ymd(d)] ||= []).push(r); d.setDate(d.getDate()+1); }
  }
  const m = st.month, y = m.getFullYear(), mo = m.getMonth();
  const start = new Date(y, mo, 1 - new Date(y, mo, 1).getDay());
  const today = ymd(new Date());
  const cells = DOW.map((d,i)=>h("div",{class:"dow"}, d));
  for (let i=0; i<42; i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    if (i >= 35 && d.getMonth() !== mo) break;
    const k = ymd(d), evs = byDay[k] || [];
    const cls = "day"+(d.getMonth()!==mo?" out":"")+(k===today?" today":"")+(st.sel===k?" sel":"");
    cells.push(h("div",{class:cls, onclick:()=>{ st.sel = k; redraw(); }},
      h("span",{class:"dn"}, d.getDate()),
      evs.slice(0,3).map(r=>h("button",{class:"ev",type:"button",title:rowTitle(info,r), onclick:ev=>{ ev.stopPropagation(); open(r.url,"page"); }}, rowTitle(info, r))),
      evs.length > 3 ? h("span",{class:"more"}, "+"+(evs.length-3)) : null));
  }
  const selKey = st.sel || (today.startsWith(y+"-"+pad(mo+1)) ? today : null);
  const selRows = selKey ? (byDay[selKey] || []) : [];
  return [
    h("div",{class:"cal-head"},
      h("h2",null, y+"년 "+(mo+1)+"월"),
      h("button",{class:"btn ghost",type:"button",onclick:()=>{ st.month = new Date(y, mo-1, 1); st.sel=null; redraw(); },"aria-label":"이전 달"},"‹"),
      h("button",{class:"btn ghost",type:"button",onclick:()=>{ const n=new Date(); st.month=new Date(n.getFullYear(), n.getMonth(), 1); st.sel=ymd(n); redraw(); }},"오늘"),
      h("button",{class:"btn ghost",type:"button",onclick:()=>{ st.month = new Date(y, mo+1, 1); st.sel=null; redraw(); },"aria-label":"다음 달"},"›")),
    h("div",{class:"cal"}, cells),
    selKey ? h("section",{class:"day-list"},
      h("h3",null, fmtDate(selKey)+" 일정"),
      selRows.length ? rowList(info, selRows) : h("p",{class:"meta"},"이 날은 일정이 없어요. 날짜를 누른 뒤 ‘새로 만들기’로 추가할 수 있어요.")) : null
  ];
}
function tzOffset(){
  const o = -new Date().getTimezoneOffset(), s = o >= 0 ? "+" : "-", a = Math.abs(o);
  return s+pad(Math.floor(a/60))+":"+pad(a%60);
}
function addForm(info, st, done){
  const f = h("form",{class:"form"});
  const titleIn = h("input",{id:"f-title",required:true,placeholder:"예: 병원 예약, 친구 약속",autocomplete:"off"});
  const fields = [h("label",{class:"full",for:"f-title"}, "제목", titleIn)];
  let dateIn, timeIn, selIn;
  if (info.dateProp){
    dateIn = h("input",{id:"f-date",type:"date",value: st.sel || ymd(new Date())});
    timeIn = h("input",{id:"f-time",type:"time"});
    fields.push(h("label",{for:"f-date"}, info.dateProp, dateIn), h("label",{for:"f-time"}, "시간 (선택)", timeIn));
  }
  if (info.selectProp){
    selIn = h("select",{id:"f-sel"}, h("option",{value:""},"선택 안 함"), (info.selectProp.options||[]).map(o=>h("option",{value:o.name}, o.name)));
    fields.push(h("label",{for:"f-sel"}, info.selectProp.name, selIn));
  }
  const textIns = info.textProps.map((k,i)=>{ const inp = h("input",{id:"f-t"+i,autocomplete:"off"}); fields.push(h("label",{for:"f-t"+i}, k, inp)); return [k, inp]; });
  const msg = h("span",{class:"msg",role:"alert"});
  const submit = h("button",{class:"btn primary",type:"submit"},"Notion에 추가");
  fields.push(h("div",{class:"acts"}, msg, h("button",{class:"btn",type:"button",onclick:()=>{ st.adding=false; f.remove(); }},"취소"), submit));
  f.append(...fields);
  f.addEventListener("submit", async ev=>{
    ev.preventDefault();
    const t = titleIn.value.trim();
    if (!t){ msg.textContent = "제목을 입력해 주세요."; titleIn.focus(); return; }
    const props = {[info.titleProp]: t};
    if (dateIn && dateIn.value){
      if (timeIn.value){ props["date:"+info.dateProp+":start"] = dateIn.value+"T"+timeIn.value+":00"+tzOffset(); props["date:"+info.dateProp+":is_datetime"] = 1; }
      else { props["date:"+info.dateProp+":start"] = dateIn.value; props["date:"+info.dateProp+":is_datetime"] = 0; }
    }
    if (selIn && selIn.value) props[info.selectProp.name] = selIn.value;
    for (const [k, inp] of textIns) if (inp.value.trim()) props[k] = inp.value.trim();
    submit.disabled = true; submit.textContent = "추가하는 중…"; msg.textContent = "";
    try{
      await write("notion-create-pages", {parent:{type:"data_source_id", data_source_id: info.sources[0].replace("collection://","")}, pages:[{properties: props}], allow_async:false});
      toast("Notion에 ‘"+t+"’을(를) 추가했어요");
      if (dateIn && dateIn.value){ st.sel = dateIn.value; const d = new Date(dateIn.value+"T00:00:00"); st.month = new Date(d.getFullYear(), d.getMonth(), 1); }
      await done();
    }catch(e){
      const info2 = errInfo(e);
      const ambiguous = ["server_unavailable","upstream_error",undefined].includes(e && e.code);
      msg.textContent = ambiguous ? "추가됐는지 확실하지 않아요. ‘새로고침’으로 목록을 확인한 뒤 필요하면 다시 추가해 주세요." : info2.msg;
      submit.disabled = false; submit.textContent = "Notion에 추가";
    }
  });
  setTimeout(()=>titleIn.focus(), 0);
  return f;
}
